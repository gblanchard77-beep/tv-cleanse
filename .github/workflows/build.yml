name: build-home-screen

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (for example v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: bash launcher/build.sh
      - name: Keep the APK from this run
        uses: actions/upload-artifact@v4
        with:
          name: tvcleanse-home
          path: |
            launcher/out/tvcleanse-home.apk
            launcher/out/tvcleanse-home.apk.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            launcher/out/tvcleanse-home.apk \
            launcher/out/tvcleanse-home.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "TV Cleanse home screen. Install with: ./tvcleanse.sh <TV_IP> home-install"
