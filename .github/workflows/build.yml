name: build-home-screen

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: bash launcher/build.sh
      - name: Keep the APK from this run
        uses: actions/upload-artifact@v4
        with:
          name: tvcleanse-home
          path: |
            launcher/out/tvcleanse-home.apk
            launcher/out/tvcleanse-home.apk.sha256
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            launcher/out/tvcleanse-home.apk \
            launcher/out/tvcleanse-home.apk.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "TV Cleanse home screen. Install with: ./tvcleanse.sh <TV_IP> home-install"
